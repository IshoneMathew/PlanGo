name: travel_app
description: PlanGo - Travel Exploration & Booking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  google_maps_flutter: ^2.5.3
  http: ^1.2.0
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.0
  provider: ^6.1.2
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# ── App Icon ──────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/app_icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/images/logo/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

# ── Native Splash Screen ──────────────────────────────────────────
flutter_native_splash:
  color: "#0D0D0D"
  image: assets/images/logo/app_icon.png
  color_dark: "#0D0D0D"
  image_dark: assets/images/logo/app_icon.png
  android_12:
    color: "#0D0D0D"
    image: assets/images/logo/app_icon.png
    icon_background_color: "#0D0D0D"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo/
